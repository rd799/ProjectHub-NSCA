<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSCA · ProjectHub v3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --br:#1C4FC4;--br-h:#1640A8;--br-lt:#EEF3FD;--br-md:#DBEAFE;
  --ok:#0A6E3F;--ok-lt:#ECFDF5;--ok-md:#D1FAE5;
  --wn:#92510A;--wn-lt:#FFFBEB;--wn-md:#FEF3C7;
  --er:#991B1B;--er-lt:#FEF2F2;--er-md:#FEE2E2;
  --pu:#5B21B6;--pu-lt:#F5F3FF;--pu-md:#EDE9FE;
  --tl:#0F766E;--tl-lt:#F0FDFA;--tl-md:#CCFBF1;
  --s1:#0F172A;--s2:#334155;--s3:#64748B;--s4:#94A3B8;--s5:#CBD5E1;--s6:#E2E8F0;--s7:#F1F5F9;--s8:#F8FAFC;
  --sf:#fff;--bg:#F1F5F9;
  --r:6px;--rl:10px;--rxl:14px;
  --sh:0 1px 3px rgba(0,0,0,.06);--sh2:0 4px 16px rgba(0,0,0,.1);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--s2);font-size:13px;line-height:1.5}
/* LAYOUT */
.app{display:flex;height:100vh}
.sb{width:218px;flex-shrink:0;background:var(--sf);border-right:1px solid var(--s6);display:flex;flex-direction:column}
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tb{height:52px;background:var(--sf);border-bottom:1px solid var(--s6);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0}
.sc{flex:1;overflow-y:auto;padding:18px 20px}
/* SIDEBAR */
.brand{padding:14px 14px 12px;border-bottom:1px solid var(--s6)}
.brow{display:flex;align-items:center;gap:9px}
.bic{width:32px;height:32px;background:var(--br);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bnm{font-weight:700;font-size:13px;color:var(--s1);line-height:1.2}
.bsb{font-size:10px;color:var(--s4)}
.nav{flex:1;overflow-y:auto;padding:7px 5px}
.ns{font-size:10px;font-weight:600;color:var(--s4);padding:7px 8px 2px;text-transform:uppercase;letter-spacing:.07em}
.ni{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--r);cursor:pointer;color:var(--s3);font-size:12px;border:none;background:none;width:100%;text-align:left;transition:all .1s}
.ni:hover{background:var(--s7);color:var(--s2)}
.ni.on{background:var(--br-lt);color:var(--br);font-weight:500}
.ni svg{width:14px;height:14px;flex-shrink:0;opacity:.55}
.ni.on svg{opacity:1}
.nb{margin-left:auto;font-size:10px;font-weight:600;padding:1px 5px;border-radius:8px;background:var(--s6);color:var(--s3);min-width:16px;text-align:center}
.ni.on .nb{background:var(--br-md);color:var(--br)}
.nb.hot{background:var(--er-md);color:var(--er)}
.nb.warn{background:var(--wn-md);color:var(--wn)}
.sbf{padding:10px 12px;border-top:1px solid var(--s6);display:flex;align-items:center;gap:8px}
.uav{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.uav.admin{background:var(--br-lt);color:var(--br)}
.uav.bo{background:var(--pu-lt);color:var(--pu)}
.uav.npp{background:var(--ok-lt);color:var(--ok)}
.unm{font-size:12px;font-weight:600;color:var(--s1)}
.url{font-size:10px;color:var(--s3)}
.rbadge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px}
.rbadge.admin{background:var(--br-md);color:var(--br)}
.rbadge.bo{background:var(--pu-md);color:var(--pu)}
.rbadge.npp{background:var(--ok-md);color:var(--ok)}
/* TOPBAR */
.pt{font-size:15px;font-weight:700;color:var(--s1);flex:1}
.bc{font-size:12px;color:var(--s4);flex:1}
.bc b{color:var(--s2);font-weight:500}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;border:1px solid;white-space:nowrap;transition:all .1s}
.bg0{background:var(--sf);border-color:var(--s5);color:var(--s3)}.bg0:hover{background:var(--s7);color:var(--s2)}
.bp{background:var(--br);border-color:var(--br);color:#fff}.bp:hover{background:var(--br-h)}
.bok{background:var(--ok-lt);border-color:var(--ok-md);color:var(--ok)}.bok:hover{background:var(--ok-md)}
.bwn{background:var(--er-lt);border-color:var(--er-md);color:var(--er)}.bwn:hover{background:var(--er-md)}
.bsm{padding:5px 10px;font-size:11px}
.bic2{width:30px;height:30px;padding:0;justify-content:center}
/* CARDS */
.card{background:var(--sf);border:1px solid var(--s6);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh)}
.ch{padding:12px 16px;border-bottom:1px solid var(--s6);display:flex;align-items:center;gap:9px;background:var(--s8)}
.ct{font-size:13px;font-weight:600;color:var(--s1);flex:1}
.cb{padding:14px 16px}
.fb{padding:9px 16px;border-bottom:1px solid var(--s6);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.fb input,.fb select{font-size:12px;padding:5px 9px;border:1px solid var(--s5);border-radius:var(--r);background:var(--sf);color:var(--s2);outline:none;height:30px}
.fb input:focus,.fb select:focus{border-color:#93C5FD}
.fsp{flex:1}
/* STATS */
.sg{display:grid;gap:11px;margin-bottom:15px}
.sg4{grid-template-columns:repeat(4,1fr)}.sg5{grid-template-columns:repeat(5,1fr)}.sg3{grid-template-columns:repeat(3,1fr)}.sg2{grid-template-columns:repeat(2,1fr)}
.sc2{background:var(--sf);border:1px solid var(--s6);border-radius:var(--rl);padding:14px 16px;box-shadow:var(--sh)}
.sl{font-size:11px;font-weight:500;color:var(--s3);margin-bottom:5px}
.sv{font-size:24px;font-weight:700;line-height:1;letter-spacing:-.5px}
.ss{font-size:11px;color:var(--s4);margin-top:3px}
.sc2.blue .sv{color:var(--br)}.sc2.green .sv{color:var(--ok)}.sc2.amber .sv{color:var(--wn)}.sc2.red .sv{color:var(--er)}.sc2.pur .sv{color:var(--pu)}.sc2.teal .sv{color:var(--tl)}
/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{padding:8px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--s3);background:var(--s8);border-bottom:1px solid var(--s6);white-space:nowrap;position:sticky;top:0;z-index:2}
tbody td{padding:8px 14px;border-bottom:1px solid var(--s6);color:var(--s2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--s7);cursor:pointer}
.tc{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc2{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnw{white-space:nowrap}.tmn{font-family:'Cascadia Code','Consolas',monospace;font-size:11px;color:var(--br)}.tr{text-align:right}
/* BADGES */
.bx{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:500;white-space:nowrap}
.bx::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.bd{background:var(--wn-lt);color:var(--wn)}.bd::before{background:var(--wn)}
.ba{background:var(--ok-lt);color:var(--ok)}.ba::before{background:var(--ok)}
.br2{background:var(--er-lt);color:var(--er)}.br2::before{background:var(--er)}
.bc2{background:var(--br-lt);color:var(--br)}.bc2::before{background:var(--br)}
.bg2{background:var(--s7);color:var(--s3)}.bg2::before{background:var(--s4)}
.bt{background:var(--tl-lt);color:var(--tl)}.bt::before{background:var(--tl)}
.bp2{background:var(--pu-lt);color:var(--pu)}.bp2::before{background:var(--pu)}
.bxi{background:var(--br-lt);color:var(--br);padding:2px 8px}.bxi::before{display:none}
.btag{background:var(--s7);color:var(--s3);border:1px solid var(--s6);border-radius:4px;padding:1px 6px;font-size:11px}.btag::before{display:none}
.phase-r{background:#FEF2F2;color:#991B1B}
.phase-0{background:var(--s7);color:var(--s3)}
.phase-1{background:#EFF6FF;color:#1D4ED8}
.phase-2{background:var(--wn-lt);color:var(--wn)}
.phase-3{background:var(--pu-lt);color:var(--pu)}
.phase-4{background:var(--tl-lt);color:var(--tl)}
.phase-5{background:var(--ok-lt);color:var(--ok)}
.phase-6{background:var(--s7);color:var(--s4)}
/* PAGINATION */
.pag{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-top:1px solid var(--s6);background:var(--s8)}
.pi{font-size:11px;color:var(--s3)}.pbs{display:flex;gap:3px}
.pb{padding:4px 8px;border:1px solid var(--s5);border-radius:4px;background:var(--sf);font-size:11px;cursor:pointer;color:var(--s3)}
.pb:hover:not([disabled]){background:var(--s7)}.pb.on{background:var(--br);color:#fff;border-color:var(--br)}.pb[disabled]{opacity:.3;cursor:default}
/* MODAL */
.mbk{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.mbox{background:var(--sf);border-radius:var(--rxl);max-width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--sh2);border:1px solid var(--s6)}
.mbox.wd{width:700px}.mbox.md{width:560px}.mbox.sm{width:420px}
.mhd{padding:16px 20px;border-bottom:1px solid var(--s6);display:flex;align-items:flex-start;gap:11px}
.mic2{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mht{flex:1}.mt{font-size:14px;font-weight:700;color:var(--s1)}.ms{font-size:11px;color:var(--s4);margin-top:2px}
.mcl{background:none;border:none;cursor:pointer;font-size:19px;color:var(--s4);padding:3px 6px;border-radius:4px;line-height:1}
.mcl:hover{background:var(--s7)}
.mbd{padding:18px 20px;overflow-y:auto;flex:1}
.mft{padding:12px 20px;border-top:1px solid var(--s6);display:flex;gap:7px;justify-content:flex-end;background:var(--s8);border-radius:0 0 var(--rxl) var(--rxl)}
/* FORM */
.fs{font-size:10px;font-weight:700;color:var(--s4);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--s6)}
.fs:first-child{margin-top:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ff{display:flex;flex-direction:column;gap:4px}.ff.full{grid-column:1/-1}
.fl{font-size:11px;font-weight:500;color:var(--s3)}.fl .req{color:var(--er);margin-left:2px}
.fi{padding:7px 10px;border:1px solid var(--s5);border-radius:var(--r);font-size:12px;color:var(--s2);background:var(--sf);outline:none;width:100%;transition:border .1s}
.fi:focus{border-color:#93C5FD;box-shadow:0 0 0 3px rgba(147,197,253,.12)}
.fi[readonly]{background:var(--s7);color:var(--br);font-family:'Cascadia Code',monospace;font-weight:700}
textarea.fi{resize:vertical;min-height:65px}
.fh{font-size:10px;color:var(--s4);margin-top:1px}
.chkl{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.chk{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;padding:4px 9px;border:1px solid var(--s5);border-radius:var(--r);background:var(--sf);user-select:none;transition:all .1s}
.chk:hover{border-color:var(--s4);background:var(--s7)}
.chk input{accent-color:var(--br)}
.rrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:3px}
.ro{display:flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--s5);border-radius:var(--r);cursor:pointer;font-size:12px;flex:1;transition:all .1s}
.ro:hover{border-color:var(--br);background:var(--br-lt)}
.ro.on{border-color:var(--br);background:var(--br-lt);color:var(--br);font-weight:500}
.rdot{width:13px;height:13px;border-radius:50%;border:2px solid var(--s5);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ro.on .rdot{border-color:var(--br)}.ro.on .rdot::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--br);display:block}
/* DETAIL */
.dl{display:grid;grid-template-columns:1fr 290px;gap:14px}
.tabs{display:flex;border-bottom:1px solid var(--s6);padding:0 16px}
.tab{padding:9px 12px;font-size:12px;cursor:pointer;color:var(--s3);border:none;background:none;border-bottom:2px solid transparent;font-weight:500}
.tab:hover{color:var(--s2)}.tab.on{color:var(--br);border-bottom-color:var(--br)}
.tp{display:none}.tp.on{display:block}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:15px}
.df{display:flex;flex-direction:column;gap:3px}.df.full{grid-column:1/-1}
.dk{font-size:10px;font-weight:700;color:var(--s4);text-transform:uppercase;letter-spacing:.05em}
.dv{font-size:13px;color:var(--s2)}.dv.em{color:var(--s4);font-style:italic}.dv.mn{font-family:'Cascadia Code',monospace;font-size:12px;color:var(--br)}
.dsec{grid-column:1/-1;font-size:10px;font-weight:700;color:var(--s4);text-transform:uppercase;letter-spacing:.07em;padding:9px 0 5px;border-bottom:1px solid var(--s6);margin-top:3px}
.dsec:first-child{margin-top:0;padding-top:0}
/* MILESTONE */
.ml-wrap{padding:14px 16px}
.ml-item{border:1px solid var(--s6);border-radius:var(--rl);margin-bottom:10px;overflow:hidden}
.ml-item:last-child{margin-bottom:0}
.ml-head{padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.ml-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.ml-title{font-size:12px;font-weight:600;flex:1}
.ml-meta{font-size:11px;color:var(--s3)}
.ml-body{padding:12px 14px;border-top:1px solid var(--s6);background:var(--s8)}
.ml-update{font-size:11px;color:var(--s2);margin-bottom:8px;line-height:1.6}
.ml-deadline-bar{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:11px}
.dl-track{flex:1;background:var(--s6);border-radius:3px;height:6px;overflow:hidden}
.dl-fill{height:100%;border-radius:3px}
/* REVOKE */
.revoke-banner{background:var(--er-lt);border:1px solid var(--er-md);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.revoke-banner.warn-banner{background:var(--wn-lt);border-color:var(--wn-md)}
/* INFO LIST */
.il{display:flex;flex-direction:column}
.ir{display:flex;align-items:flex-start;padding:8px 16px;border-bottom:1px solid var(--s6);gap:10px;font-size:12px}
.ir:last-child{border-bottom:none}
.ik{width:155px;flex-shrink:0;color:var(--s3);font-weight:500}.iv{color:var(--s2);flex:1}
/* MISC */
.es{padding:44px 20px;text-align:center;color:var(--s4)}.es p{font-size:13px;margin-top:6px}
.chip{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;border:1px solid var(--s5);background:var(--s7);color:var(--s3);margin:1px}
.2c{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.3c{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.notice{padding:9px 13px;border-radius:var(--r);font-size:12px;display:flex;gap:8px;align-items:flex-start;margin-bottom:12px}
.ni2{background:var(--br-lt);border:1px solid var(--br-md);color:var(--br)}
.nw{background:var(--wn-lt);border:1px solid var(--wn-md);color:var(--wn)}
.ne{background:var(--er-lt);border:1px solid var(--er-md);color:var(--er)}
.nok{background:var(--ok-lt);border:1px solid var(--ok-md);color:var(--ok)}
.pb2b{background:var(--s6);border-radius:4px;height:5px;overflow:hidden}
.pf2{height:100%;border-radius:4px}
.tl{padding:0 16px 12px}
.tli{display:flex;gap:11px;position:relative}
.tli:not(:last-child)::before{content:'';position:absolute;left:11px;top:24px;bottom:-11px;width:1px;background:var(--s6)}
.tld{width:23px;height:23px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;margin-top:11px}
.tld.gr{background:var(--ok-lt);border:2px solid var(--ok-md)}.tld.bl{background:var(--br-lt);border:2px solid var(--br-md)}.tld.am{background:var(--wn-lt);border:2px solid var(--wn-md)}.tld.gy{background:var(--s7);border:2px solid var(--s6)}.tld.re{background:var(--er-lt);border:2px solid var(--er-md)}
.tlb{flex:1;padding:11px 0}
.tlt{font-size:12px;font-weight:600;color:var(--s1)}.tls{font-size:11px;color:var(--s3)}.tlt2{font-size:10px;color:var(--s4);margin-top:2px}
/* KPI */
.kpi{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.kpl{width:130px;font-size:12px;color:var(--s2);flex-shrink:0;font-weight:500}
.kpb{flex:1;background:var(--s6);border-radius:4px;height:7px;overflow:hidden}
.kpf{height:100%;border-radius:4px}
.kpv{width:40px;font-size:12px;text-align:right;font-weight:600;flex-shrink:0}
/* RING */
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring svg{transform:rotate(-90deg)}
.ri{position:absolute;text-align:center}
.rn{font-size:17px;font-weight:700;line-height:1}.rl2{font-size:10px;color:var(--s4)}
/* LOGIN */
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.lb{background:var(--sf);border:1px solid var(--s6);border-radius:var(--rxl);padding:34px 34px 26px;width:390px;box-shadow:var(--sh2)}
/* SETTINGS */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.set-card{background:var(--sf);border:1px solid var(--s6);border-radius:var(--rl);padding:16px;cursor:pointer;transition:all .15s}
.set-card:hover{border-color:var(--br);background:var(--br-lt)}
.set-ic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.set-t{font-size:13px;font-weight:600;color:var(--s1);margin-bottom:4px}
.set-d{font-size:11px;color:var(--s3);line-height:1.5}
.set-a{font-size:11px;color:var(--br);font-weight:500;margin-top:8px;display:inline-block}
.cfg-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--s6)}
.cfg-row:last-child{border-bottom:none}
.cfg-l{font-size:12px;font-weight:500;color:var(--s2)}.cfg-s{font-size:11px;color:var(--s4);margin-top:1px}
.tog{position:relative;display:inline-block;width:34px;height:19px;cursor:pointer}
.tog input{display:none}
.tsl{position:absolute;inset:0;background:var(--s5);border-radius:19px;transition:.2s}
.tsl::before{content:'';position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.tog input:checked+.tsl{background:var(--br)}
.tog input:checked+.tsl::before{transform:translateX(15px)}
/* EXPORT */
.exp-status-0{background:#F0FDF4;color:#166534}
.exp-status-1{background:var(--wn-lt);color:var(--wn)}
.exp-status-2{background:var(--pu-lt);color:var(--pu)}
.exp-status-3{background:var(--er-lt);color:var(--er)}
/* SUCC */
.succ{text-align:center;padding:30px 20px}
.succ-ic{width:54px;height:54px;border-radius:50%;background:var(--ok-lt);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;border:2px solid var(--ok-md)}
.succ-code{font-family:'Cascadia Code',monospace;font-size:19px;font-weight:700;color:var(--br);background:var(--br-lt);border:1px solid var(--br-md);padding:9px 22px;border-radius:var(--r);display:inline-block;margin-bottom:16px;letter-spacing:1px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts" style="position:fixed;top:14px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:7px"></div>
<script>
'use strict';
// ══════════════════════════════════════

const supa = {
  _h: () => ({ 'Content-Type':'application/json', 'apikey': SUPA_KEY, 'Authorization': 'Bearer '+SUPA_KEY }),

  async get(table, params=''){
    try {
      const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${params}`, { headers: supa._h() });
      if(!r.ok) throw new Error(`GET ${table}: ${r.status}`);
      return await r.json();
    } catch(e) { console.warn('Supabase GET failed, using local data:', e.message); return null; }
  },

  async insert(table, data){
    try {
      const r = await fetch(`${SUPA_URL}/rest/v1/${table}`, {
        method:'POST', headers: {...supa._h(), 'Prefer':'return=representation'},
        body: JSON.stringify(Array.isArray(data)?data:[data])
      });
      if(!r.ok) throw new Error(`INSERT ${table}: ${r.status} ${await r.text()}`);
      return await r.json();
    } catch(e) { console.warn('Supabase INSERT failed:', e.message); return null; }
  },

  async update(table, id, data, idCol='id'){
    try {
      const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${idCol}=eq.${encodeURIComponent(id)}`, {
        method:'PATCH', headers: {...supa._h(), 'Prefer':'return=representation'},
        body: JSON.stringify(data)
      });
      if(!r.ok) throw new Error(`UPDATE ${table}: ${r.status}`);
      return await r.json();
    } catch(e) { console.warn('Supabase UPDATE failed:', e.message); return null; }
  },

  async upsert(table, data, onConflict='id'){
    try {
      const r = await fetch(`${SUPA_URL}/rest/v1/${table}?on_conflict=${onConflict}`, {
        method:'POST', headers: {...supa._h(), 'Prefer':'resolution=merge-duplicates,return=representation'},
        body: JSON.stringify(Array.isArray(data)?data:[data])
      });
      if(!r.ok) throw new Error(`UPSERT ${table}: ${r.status} ${await r.text()}`);
      return await r.json();
    } catch(e) { console.warn('Supabase UPSERT failed:', e.message); return null; }
  },

  async delete(table, id, idCol='id'){
    try {
      const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${idCol}=eq.${encodeURIComponent(id)}`, {
        method:'DELETE', headers: supa._h()
      });
      if(!r.ok) throw new Error(`DELETE ${table}: ${r.status}`);
      return true;
    } catch(e) { console.warn('Supabase DELETE failed:', e.message); return false; }
  },

  async rpc(fn, params={}){
    try {
      const r = await fetch(`${SUPA_URL}/rest/v1/rpc/${fn}`, {
        method:'POST', headers: supa._h(), body: JSON.stringify(params)
      });
      if(!r.ok) throw new Error(`RPC ${fn}: ${r.status}`);
      return await r.json();
    } catch(e) { console.warn('Supabase RPC failed:', e.message); return null; }
  }
};

// ── Load all data from Supabase on startup ──────────────────
async function loadFromSupabase(){
  const statusEl = document.createElement('div');
  statusEl.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1C4FC4;color:#fff;padding:9px 20px;border-radius:8px;font-size:12px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.2)';
  statusEl.textContent='⟳ Đang tải dữ liệu từ Supabase...';
  document.body.appendChild(statusEl);

  try {
    const [dists, projs, reqs, milsRaw, qs, ords, tsks, exCusts] = await Promise.all([
      supa.get('distributors','select=*&order=code.asc'),
      supa.get('projects','select=*&order=created_date.desc'),
      supa.get('project_requests','select=*&order=date.desc'),
      supa.get('milestones','select=*'),
      supa.get('quotes','select=*&order=date.desc'),
      supa.get('orders','select=*&order=date.desc'),
      supa.get('tasks','select=*&order=created_date.desc'),
      supa.get('export_customers','select=*&order=name.asc'),
    ]);

    if(dists && dists.length>0){
      // Map snake_case DB rows → camelCase app objects
      DIST_LIST.length=0;
      dists.forEach(d=>DIST_LIST.push({
        id:d.id, code:d.code, name:d.name, tier:d.tier,
        region:d.region, phone:d.phone, email:d.email,
        boId:d.bo_id, active:d.active, joinDate:d.join_date,
        projCount:0, bgCount:0, winRate:parseFloat(d.win_rate)||0,
        totalValue:d.total_value||0, avgResponse:parseFloat(d.avg_response)||5
      }));
    }

    if(projs && projs.length>0){
      PROJECTS.length=0;
      projs.forEach(p=>PROJECTS.push({
        id:p.id, code:p.code, name:p.name, distCode:p.dist_code,
        type:p.type, country:p.country||'Việt Nam',
        province:p.province||'', district:p.district||'',
        address:p.address||'', cdt:p.cdt||'',
        architect:p.architect||'', gc:p.gc||'', mep:p.mep||'',
        pccc:p.pccc||'', consultPccc:p.consult_pccc||'',
        floors:p.floors||0, gfa:p.gfa||0,
        phase:p.phase||'Đăng ký', phaseCode:p.phase_code||0,
        progress:p.progress||0, exclusive:p.exclusive,
        products:p.products||[], standards:p.standards||[],
        specIn:p.spec_in||false, currency:p.currency||'VND',
        incoterm:p.incoterm||null, revokeStatus:p.revoke_status||null,
        notes:p.notes||'', lockedBy:p.locked_by||[],
        createdDate:p.created_date, quotes:[]
      }));
    }

    if(reqs && reqs.length>0){
      REQUESTS.length=0;
      reqs.forEach(r=>REQUESTS.push({
        id:r.id, date:r.date, distCode:r.dist_code, rep:r.rep||'',
        repPhone:r.rep_phone||'', projectName:r.project_name,
        province:r.province||'', district:r.district||'',
        country:r.country||'Việt Nam', type:r.type||'',
        cdt:r.cdt||'', gc:r.gc||'', architect:r.architect||'',
        estimatedValue:r.estimated_value||'',
        products:r.products||[], note:r.note||'', status:r.status
      }));
    }

    if(milsRaw && milsRaw.length>0){
      Object.keys(MILESTONES).forEach(k=>delete MILESTONES[k]);
      milsRaw.forEach(m=>{
        if(!MILESTONES[m.project_id]) MILESTONES[m.project_id]=[];
        MILESTONES[m.project_id].push({
          mid:m.milestone_id, dueDate:m.due_date,
          updatedDate:m.updated_date, note:m.note||'',
          status:m.status, enteredBy:m.entered_by||'bo'
        });
      });
    }

    if(qs && qs.length>0){
      QUOTES_ALL.length=0;
      qs.forEach(q=>QUOTES_ALL.push({
        id:q.id, projectId:q.project_id, projectCode:q.project_code||'',
        projectName:q.project_name||'', distCode:q.dist_code||'',
        boId:q.bo_id||'bo1', date:q.date, version:q.version||1,
        totalValue:q.total_value||0, status:q.status||'draft',
        products:q.products||[], note:q.note||'',
        discount:parseFloat(q.discount)||0, wonLost:q.won_lost||null
      }));
      // Sync quotes back to project.quotes array
      PROJECTS.forEach(p=>{
        p.quotes=QUOTES_ALL.filter(q=>q.projectId===p.id).map(q=>({
          date:q.date, label:`BG v${q.version}`, by:q.boId, value:fmtB(q.totalValue)+' ₫'
        }));
      });
    }

    if(ords && ords.length>0){
      ORDERS.length=0;
      ords.forEach(o=>ORDERS.push({
        id:o.id, projectId:o.project_id, projectCode:o.project_code||'',
        projectName:o.project_name||'', distCode:o.dist_code||'',
        boId:o.bo_id||'bo1', date:o.date, invoiceDate:o.invoice_date,
        paymentDueDate:o.payment_due_date, paymentTermDays:o.payment_term_days||30,
        totalValue:o.total_value||0, paidAmount:o.paid_amount||0,
        paidDate:o.paid_date||null, status:o.status||'unpaid',
        deliveryProgress:o.delivery_progress||0,
        debtAlert:o.debt_alert||false, notes:o.notes||'',
        items:[], productionItems:[]
      }));
    }

    if(tsks && tsks.length>0){
      TASKS.length=0;
      tsks.forEach(t=>TASKS.push({
        id:t.id, type:t.type, projectId:t.project_id||'',
        projectCode:t.project_code||'', projectName:t.project_name||'',
        distCode:t.dist_code||'', boId:t.bo_id||'bo1',
        status:t.status||'todo', priority:t.priority||'medium',
        dueDate:t.due_date||null, createdDate:t.created_date,
        completedDate:t.completed_date||null, note:t.note||'',
        autoCreated:t.auto_created||false
      }));
    }

    if(exCusts && exCusts.length>0){
      EXPORT_CUSTOMERS.length=0;
      exCusts.forEach(c=>EXPORT_CUSTOMERS.push({
        id:c.id, name:c.name, country:c.country, contact:c.contact||'',
        email:c.email||'', phone:c.phone||'', type:c.type||'CĐT',
        currency:c.currency||'USD', incoterm:c.incoterm||'',
        paymentTerms:c.payment_terms||'', notes:c.notes||'', quotes:[]
      }));
    }

    statusEl.style.background='#0A6E3F';
    statusEl.textContent='✓ Đã kết nối Supabase — dữ liệu đã tải';
    setTimeout(()=>statusEl.remove(),2500);
  } catch(err){
    statusEl.style.background='#92510A';
    statusEl.textContent='⚠ Không thể kết nối Supabase — dùng dữ liệu demo';
    console.error('Supabase load error:', err);
    setTimeout(()=>statusEl.remove(),3000);
  }
}

// ── Save wrappers (called after local mutation) ────────────
async function saveProject(p){ await supa.upsert('projects', projectToRow(p)); }
async function saveRequest(r){ await supa.upsert('project_requests', requestToRow(r)); }
async function saveQuote(q){ await supa.upsert('quotes', quoteToRow(q)); }
async function saveOrder(o){ await supa.upsert('orders', orderToRow(o)); }
async function saveTask(t){ await supa.upsert('tasks', taskToRow(t)); }
async function saveDist(d){ await supa.upsert('distributors', distToRow(d)); }
async function saveMilestone(pid, m){
  await supa.upsert('milestones', milestoneToRow(pid,m), 'project_id,milestone_id');
}
async function saveOrderItems(orderId, items){
  // Delete old items then reinsert
  await supa.delete('order_items', orderId, 'order_id');
  if(items && items.length>0){
    await supa.insert('order_items', items.map(i=>({
      order_id:orderId, product:i.product,
      qty:i.qty, unit_price:i.unitPrice,
      produced:i.produced||0, delivered:i.delivered||0, pct:i.pct||0
    })));
  }
}

function doLogin(){
  const e=$('le')?.value.trim(),p=$('lp')?.value;
  const u=USERS.find(x=>x.email===e&&x.password===p);
  if(!u){$('lerr').style.display='block';return;}
  Object.assign(ST,{role:u.role,userId:u.id,distCode:u.distCode||null,sub:null,tab:'info'});
  if(u.role==='bo')ST.boAssigned=u.assignedDist||[];
  renderShell();
}
function doLogout(){ST.role=null;showLogin();}

const MC=()=>$('main-content');
const phaseBx=(code)=>`<span class="bx ${PHASE_CLS[code]||'phase-0'}">${PHASE_NAMES[code]||'—'}</span>`;
const statBx=s=>({pending:`<span class="bx bd">Chờ duyệt</span>`,approved:`<span class="bx ba">Đã duyệt</span>`,rejected:`<span class="bx br2">Từ chối</span>`}[s]||'—');
const revokeBx=(r)=>r==='overdue'?`<span class="bx br2">⚠ Quá hạn</span>`:r==='warned'?`<span class="bx bd">Cảnh báo</span>`:'';
const getMilestoneStatus=(pid)=>{const ms=MILESTONES[pid]||[];const od=ms.filter(m=>m.status==='overdue');const wn=ms.filter(m=>m.status==='warn');if(od.length)return{cls:'br2',txt:'Quá hạn'};if(wn.length)return{cls:'bd',txt:'Cần cập nhật'};return{cls:'ba',txt:'Đúng hạn'};};
const distScore=d=>{const w=d.winRate||0,r=Math.max(0,10-d.avgResponse)*10,v=Math.min(100,(d.totalValue||0)/1e9*2),p=Math.min(100,(d.projCount||0)*15);return Math.round(w*.35+r*.25+v*.25+p*.15);};
const scColor=v=>v>=70?'#0A6E3F':v>=50?'#1C4FC4':v>=30?'#92510A':'#991B1B';
function scoreRing(score,sz=54){
  const r=21,c=score/100,stroke=4.5,circ=2*Math.PI*r,dash=circ*c,gap=circ*(1-c),col=scColor(score);
  return `<div class="ring" style="width:${sz}px;height:${sz}px"><svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" stroke="var(--s6)" stroke-width="${stroke}" fill="none"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" stroke="${col}" stroke-width="${stroke}" fill="none" stroke-dasharray="${dash.toFixed(1)} ${gap.toFixed(1)}" stroke-linecap="round"/></svg><div class="ri"><div class="rn" style="color:${col};font-size:${sz>48?16:12}px">${score}</div><div class="rl2">điểm</div></div></div>`;
}

function projRow(p,clickable=true){
  const ms=getMilestoneStatus(p.id);
  return `<tr${clickable?` onclick="nav('project-detail',{sub:'${p.id}'})"`:''}>${[
    `<td class="tmn">${esc(p.code)}</td>`,
    `<td><span style="font-weight:600;display:block;max-width:195px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span>${p.country!=='Việt Nam'?`<span style="font-size:10px;color:var(--tl)">🌐 ${esc(p.country)}</span>`:''}</td>`,
    `<td><span class="bxi">${esc(p.distCode)}</span></td>`,
    `<td style="font-size:11px;color:var(--s3)">${esc(p.type)}</td>`,
    `<td>${p.country!=='Việt Nam'?'🌐 '+esc(p.country):esc(p.province)}</td>`,
    `<td>${phaseBx(p.phaseCode)}</td>`,
    `<td style="min-width:90px"><div style="font-size:10px;color:var(--s4);margin-bottom:3px">${p.progress}%</div><div class="pb2b" style="width:80px"><div class="pf2" style="width:${p.progress}%;background:var(--br)"></div></div></td>`,

    `<td><span class="bx ${p.exclusive?'bc2':'ba'}">${p.exclusive?'Chỉ định':'Mở'}</span></td>`,
  ].join('')}</tr>`;
}

  if(fNPP)list=list.filter(p=>p.distCode===fNPP);

function nppSubmit(){
  const n=$('nr-n')?.value?.trim(),cdt=$('nr-cdt')?.value?.trim();
  if(!n){toast('Nhập tên dự án','err');return;}
  if(!cdt){toast('Nhập tên CĐT','err');return;}
  const u=USERS.find(x=>x.id===ST.userId);
  const prods=[...document.querySelectorAll('#app .chkl input:checked')].map(i=>i.value);
  const r={id:genRId(),date:today(),distCode:ST.distCode,rep:u?.name||'',repPhone:'',projectName:n,country:$('nr-cn')?.value||'Việt Nam',province:$('nr-pv')?.value||'',district:$('nr-di')?.value||'',type:$('nr-tp')?.value||'',cdt,gc:$('nr-gc')?.value||'',architect:$('nr-arch')?.value||'',estimatedValue:$('nr-v')?.value||'',products:prods,note:$('nr-note')?.value||'',status:'pending'};
  REQUESTS.unshift(r);
  const nb=$('nb-req');if(nb){const p=REQUESTS.filter(x=>x.status==='pending').length;nb.textContent=p;}
  saveRequest(r);
  toast(`Đã gửi yêu cầu ${r.id}!`,'ok');nav('npp-dash');
}

function selAlloc(el,v){document.querySelectorAll('#alloc-r .ro').forEach(o=>o.classList.remove('on'));el.classList.add('on');const w=$('ow');if(w)w.style.display=v==='other'?'block':'none';}

function approveR(reqId,newId,newCode){
  const req=REQUESTS.find(r=>r.id===reqId);if(!req)return;
  const opts=document.querySelectorAll('#alloc-r .ro');
  let ex=true,dc=req.distCode;
  opts.forEach(o=>{if(o.classList.contains('on')){if(o.querySelector('div div').textContent.includes('tất cả'))ex=false;if(o.querySelector('div div').textContent.includes('khác')){const s=$('ow')?.querySelector('select');if(s?.value)dc=s.value;}}});
  PROJECTS.unshift({id:newId,code:newCode,name:req.projectName,distCode:dc,type:req.type||'',country:req.country||'Việt Nam',province:req.province||'',district:req.district||'',address:'',cdt:req.cdt||'',architect:req.architect||'',gc:req.gc||'',mep:'',pccc:'',consultPccc:'',floors:0,gfa:0,phase:PHASE_NAMES[0],phaseCode:0,progress:5,exclusive:ex,products:req.products||[],standards:['TCVN'],specIn:false,currency:'VND',createdDate:today(),revokeStatus:null,notes:'',quotes:[]});
  req.status='approved';
  // Create initial milestone
  if(!MILESTONES[newId]) MILESTONES[newId]=[];
  const newMil={mid:'m0',dueDate:addDays(today(),7),updatedDate:null,note:null,status:'warn'};
  MILESTONES[newId].push(newMil);
  // Save to Supabase
  const newP=PROJECTS[0];
  saveProject(newP);
  req.status='approved'; saveRequest(req);
  saveMilestone(newId,newMil);
  const nb=$('nb-req');if(nb){const p=REQUESTS.filter(r=>r.status==='pending').length;nb.textContent=p;nb.classList.toggle('hot',p>0);}

function saveMilestone(pid,mid){
  const note=$('mu-note')?.value?.trim();
  const date=$('mu-date')?.value||today();
  const phase=parseInt($('mu-phase')?.value||'0');
  if(!note){toast('Nhập nội dung cập nhật','err');return;}
  if(!MILESTONES[pid])MILESTONES[pid]=[];
  const existing=MILESTONES[pid].find(m=>m.mid===mid);
  if(existing){existing.updatedDate=date;existing.note=note;existing.status='ok';}
  else MILESTONES[pid].push({mid,dueDate:addDays(today(),MILESTONE_CFG.find(c=>c.id===mid)?.maxDays||30),updatedDate:date,note,status:'ok'});
  const p=PROJECTS.find(x=>x.id===pid);
  if(p){p.phaseCode=phase;p.phase=PHASE_NAMES[phase];p.revokeStatus=null;}
  // Save to Supabase
  if(MILESTONES[pid]){
    const mObj=MILESTONES[pid].find(x=>x.mid===mid);
    if(mObj) saveMilestone(pid,mObj);
  }
  closeModal();toast('Đã lưu cập nhật tiến độ!','ok');
  if(ST.page==='project-detail')PAGES['project-detail']();
  else if(ST.page==='npp-milestones')PAGES['npp-milestones']();
  else PAGES.milestones();
}

  {id:'r2',type:'byNPP',distCodes:['NTK','IMP'],boId:'bo2',desc:'NTK & IMP → BO Cúc'},

function autoAssignBO(distCode,taskType){
  // Export task always goes to bo1
  if(taskType==='export_quote')return 'bo1';
  // NPP rule
  const rule=BO_RULES.find(r=>r.type==='byNPP'&&r.distCodes?.includes(distCode));
  if(rule)return rule.boId;
  // Overload check
  const bo1Tasks=TASKS.filter(t=>t.boId==='bo1'&&t.status!=='done').length;
  const bo2Tasks=TASKS.filter(t=>t.boId==='bo2'&&t.status!=='done').length;
  const maxTasks=BO_RULES.find(r=>r.type==='overload')?.maxTasks||8;
  if(bo1Tasks>=maxTasks&&bo2Tasks<bo1Tasks)return 'bo2';
  if(bo2Tasks>=maxTasks&&bo1Tasks<bo2Tasks)return 'bo1';
  return 'bo1';
}

function getBOStats(boId){
  const myTasks=TASKS.filter(t=>t.boId===boId);
  const done=myTasks.filter(t=>t.status==='done');
  const overdue=myTasks.filter(t=>t.status!=='done'&&t.dueDate&&daysDiff(t.dueDate,today())<0);
  const completionRate=myTasks.length?Math.round(done.length/myTasks.length*100):0;
  const myQuotes=QUOTES_ALL.filter(q=>q.boId===boId);
  const myWon=myQuotes.filter(q=>q.wonLost==='won');
  const winRate=myQuotes.filter(q=>q.wonLost).length?Math.round(myWon.length/myQuotes.filter(q=>q.wonLost).length*100):0;
  const myOrds=ORDERS.filter(o=>o.boId===boId);
  const debtRecovery=myOrds.length?Math.round(myOrds.reduce((s,o)=>s+o.paidAmount,0)/myOrds.reduce((s,o)=>s+o.totalValue,0)*100):100;
  const kpiScore=Math.round(completionRate*.3+winRate*.25+debtRecovery*.25+(100-Math.min(100,overdue.length*20))*.2);
  return {total:myTasks.length,done:done.length,overdue:overdue.length,completionRate,winRate,debtRecovery,kpiScore,activeTasks:myTasks.filter(t=>t.status!=='done').length};
}

function doExport(fmt){
  const types=[...document.querySelectorAll('#exp-types input:checked')].map(i=>i.value);
  if(!types.length){toast('Chọn ít nhất 1 loại báo cáo','err');return;}
  closeModal();
  // Simulate export with data build
  toast(`Đang xuất ${types.length} báo cáo dạng ${fmt.toUpperCase()}...`,'info');
  setTimeout(()=>{
    const rows=[['STT','Chỉ số','Giá trị','Đơn vị','Ghi chú']];
    rows.push(['1','Tổng BG đã gửi',QUOTES_ALL.length,'BG','YTD 2026']);
    rows.push(['2','Win Rate',QUOTES_ALL.filter(q=>q.wonLost).length?Math.round(QUOTES_ALL.filter(q=>q.wonLost==='won').length/QUOTES_ALL.filter(q=>q.wonLost).length*100):0,'%','']);
    rows.push(['3','Tổng GT Win',QUOTES_ALL.filter(q=>q.wonLost==='won').reduce((s,q)=>s+q.totalValue,0).toLocaleString('vi-VN'),'₫','']);
    rows.push(['4','Tổng đặt hàng',ORDERS.reduce((s,o)=>s+o.totalValue,0).toLocaleString('vi-VN'),'₫','']);
    rows.push(['5','Đã thu hồi',ORDERS.reduce((s,o)=>s+o.paidAmount,0).toLocaleString('vi-VN'),'₫','']);
    rows.push(['6','Còn công nợ',(ORDERS.reduce((s,o)=>s+o.totalValue,0)-ORDERS.reduce((s,o)=>s+o.paidAmount,0)).toLocaleString('vi-VN'),'₫','']);
    rows.push([]);rows.push(['','NPP','Win Rate','GT Win','Đơn hàng','Công nợ']);
    DIST_LIST.forEach(d=>{const dq=QUOTES_ALL.filter(q=>q.distCode===d.code);const won=dq.filter(q=>q.wonLost==='won');const dOrd=ORDERS.filter(o=>o.distCode===d.code);rows.push(['',d.code,dq.filter(q=>q.wonLost).length?Math.round(won.length/dq.filter(q=>q.wonLost).length*100)+'%':'—',won.reduce((s,q)=>s+q.totalValue,0).toLocaleString('vi-VN'),dOrd.reduce((s,o)=>s+o.totalValue,0).toLocaleString('vi-VN'),(dOrd.reduce((s,o)=>s+o.totalValue,0)-dOrd.reduce((s,o)=>s+o.paidAmount,0)).toLocaleString('vi-VN')]);});
    const csv=rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download=`NSCA_BaoCao_${today()}.${fmt==='excel'?'csv':'csv'}`;a.click();
    URL.revokeObjectURL(url);
    toast(`✓ Đã xuất ${types.length} báo cáo ${fmt.toUpperCase()} thành công!`,'ok');
  },800);
}

      ${ST.role==='admin'?`<button class="btn bg0 bsm" onclick="openBOTaskConfigModal()"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>Cấu hình nhiệm vụ</button>`:''}
    </div>
    <div class="sc">
      <!-- BO KPI STRIP -->
      <div style="display:grid;grid-template-columns:repeat(${boUsers.length},1fr);gap:10px;margin-bottom:12px">

          </tr>`;

      </table></div></div>`:''}

      <!-- TIMELINE VIEW -->
      ${viewMode==='timeline'?`<div class="card" id="task-timeline">

function moveTask(id,newStatus){

function autoAssignBOForTask(){
  const sel=$('nt-proj');const opt=sel?.options[sel.selectedIndex];
  const dist=opt?.dataset.dist;const type=$('nt-type')?.value;
  if(dist&&type){const boId=autoAssignBO(dist,type);const bSel=$('nt-bo');if(bSel)bSel.value=boId;}
}

function submitNewTask(){
  const proj=$('nt-proj')?.value,type=$('nt-type')?.value,boId=$('nt-bo')?.value;
  if(!type||!boId){toast('Điền đủ thông tin','err');return;}
  const p=proj?PROJECTS.find(x=>x.id===proj):null;
  TASKS.unshift({id:genTaskId(),type,projectId:proj||'',projectCode:p?.code||'',projectName:p?.name||'',distCode:p?.distCode||'',boId,status:'todo',priority:$('nt-prio')?.value||'medium',dueDate:$('nt-due')?.value||addDays(today(),3),createdDate:today(),note:$('nt-note')?.value||'',completedDate:null,autoCreated:false});
  const nb=$('nb-tasks');if(nb)nb.textContent=TASKS.filter(t=>t.status!=='done').length;
  const newT=TASKS[0];saveTask(newT);
  closeModal();toast('Đã tạo task và phân công!','ok');PAGES.tasks();
}

function doSavePayment(id){
  const o=ORDERS.find(x=>x.id===id);if(!o)return;
  const amt=parseFloat($('pm-amt')?.value||0);
  const dlv=parseInt($('pm-dlv')?.value??o.deliveryProgress);
  o.paidAmount=Math.min(o.totalValue,o.paidAmount+amt);
  o.paidDate=$('pm-dt')?.value||today();
  o.deliveryProgress=Math.min(100,Math.max(0,dlv));
  if(o.paidAmount>=o.totalValue)o.status='paid';
  else if(o.paidAmount>0)o.status='partial';
  o.debtAlert=o.status==='overdue'&&daysDiff(o.paymentDueDate,today())>7;
  if($('pm-note')?.value)o.notes=$('pm-note').value;
  if(o.productionItems)o.productionItems.forEach(pi=>{pi.delivered=Math.round((pi.ordered||pi.qty||0)*dlv/100);pi.pct=dlv;});
  saveOrder(o);
  closeModal();
  toast('Đã cập nhật thanh toán!','ok');
  if(ST.page==='orders')PAGES.orders();
  else if(ST.page==='project-detail')PAGES['project-detail']();
}

function submitQuoteForProject(pid){
  const val=parseFloat($('nqp-val')?.value||0);if(!val){toast('Nhập giá trị BG','err');return;}
  const p=PROJECTS.find(x=>x.id===pid);
  const prods=[...document.querySelectorAll('#modal-root .chkl input:checked')].map(i=>i.value);
  const bo=DIST_LIST.find(d=>d.code===p.distCode)?.boId||'bo1';
  const ver=parseInt($('nqp-v')?.value||1);
  const newQ={id:`BG-${today().slice(0,4)}-${String(QUOTES_ALL.length+1).padStart(3,'0')}`,projectId:pid,projectCode:p.code,projectName:p.name,distCode:p.distCode,boId:bo,date:$('nqp-d')?.value||today(),version:ver,totalValue:val,status:$('nqp-s')?.value||'draft',products:prods,note:$('nqp-note')?.value||'',discount:parseFloat($('nqp-dc')?.value||0),wonLost:null};
  QUOTES_ALL.unshift(newQ);
  p.quotes.push({date:newQ.date,label:`BG v${ver}`,by:USERS.find(u=>u.id===bo)?.name?.split(' ').slice(-1)[0]||'BO',value:fmtB(val)+' ₫'});
  // Auto-create task if BG sent
  if(newQ.status==='sent'){
    const assigned=autoAssignBO(p.distCode,'prepare_quote');
    TASKS.unshift({id:genTaskId(),type:'prepare_quote',projectId:pid,projectCode:p.code,projectName:p.name,distCode:p.distCode,boId:assigned,status:'in_progress',priority:'high',dueDate:addDays(today(),14),createdDate:today(),note:`BG v${ver} đã gửi — theo dõi phản hồi khách hàng`,completedDate:null,autoCreated:true});
  }
  closeModal();toast(`Đã tạo BG v${ver} cho ${p.code}!`,'ok');PAGES['project-detail']();
}

function submitOrderForProject(pid){
  const p=PROJECTS.find(x=>x.id===pid);if(!p)return;
  const td=parseInt($('nop-td')?.value||30);
  const rows=$('nop-items')?.querySelectorAll('div');
  const items=[];
  rows.forEach(r=>{const sel=r.querySelector('select');const qty=r.querySelectorAll('input')[0];const price=r.querySelectorAll('input')[1];if(sel&&qty?.value&&price?.value)items.push({product:sel.value,qty:parseInt(qty.value),unitPrice:parseInt(price.value),amount:parseInt(qty.value)*parseInt(price.value)});});
  if(!items.length){toast('Thêm ít nhất 1 sản phẩm','err');return;}
  const total=items.reduce((s,i)=>s+i.amount,0);
  const bo=DIST_LIST.find(d=>d.code===p.distCode)?.boId||'bo1';
  ORDERS.unshift({id:'ORD-'+Date.now(),projectId:pid,projectCode:p.code,projectName:p.name,distCode:p.distCode,boId:bo,date:today(),items,totalValue:total,invoiceDate:addDays(today(),2),paymentDueDate:addDays(today(),td+2),paymentTermDays:td,paidAmount:0,paidDate:null,status:'unpaid',deliveryProgress:0,productionItems:items.map(i=>({name:i.product,ordered:i.qty,produced:0,delivered:0,pct:0})),debtAlert:false,notes:$('nop-note')?.value||''});
  // Auto task: track debt
  const assigned=autoAssignBO(p.distCode,'track_debt');
  TASKS.unshift({id:genTaskId(),type:'track_debt',projectId:pid,projectCode:p.code,projectName:p.name,distCode:p.distCode,boId:assigned,status:'todo',priority:'medium',dueDate:addDays(today(),td),createdDate:today(),note:`Theo dõi thanh toán đơn hàng — hạn: ${addDays(today(),td+2)}`,completedDate:null,autoCreated:true});
  closeModal();toast('Đã tạo đơn hàng!','ok');PAGES['project-detail']();
}
